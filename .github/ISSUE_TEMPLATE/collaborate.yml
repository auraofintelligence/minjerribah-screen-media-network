name: Have your say or get involved
description: Tell us what you reckon, what you want to do, or what you want changed.
title: "[Community] "
labels: ["collaboration"]
body:
  - type: markdown
    attributes:
      value: |
        **Speak plainly. A short note is fine.**

        This page is public, so leave out phone numbers, private details and anything told to you in confidence.

  - type: dropdown
    id: lane
    attributes:
      label: What are you here for?
      options:
        - I have an idea
        - I want to help
        - I want to make a film or tell a story
        - I want to help with the festival or Film Club
        - I want to help with Sandy Sports
        - I can teach or train people
        - I have a venue, screen, gear or practical resource
        - My business or organisation may be interested
        - I have a question or concern
        - Something else
    validations:
      required: true

  - type: textarea
    id: say
    attributes:
      label: What do you reckon?
      description: Say what you like, what you would change, or what you think should happen.
      placeholder: Here is what I reckon...
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: What would you like to do?
      description: Tell us the part you want to make, organise, teach, host, lend, fund or help with.
      placeholder: I would like to...

  - type: textarea
    id: want
    attributes:
      label: What would you like from the project?
      description: People, gear, a place, money, advice, introductions, permission or something else.
      placeholder: I would like help with...

  - type: dropdown
    id: next
    attributes:
      label: What should happen next?
      options:
        - Reply to me here
        - Invite me to the next community yarn
        - Help me connect with the right people
        - Put this idea on the public board
        - Just take this as feedback for now
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: What name should we use?
      description: Optional. Your GitHub name is already attached to this public post.
      placeholder: Your name, group, business or leave blank
